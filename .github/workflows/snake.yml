name: Generate Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pac-Man SVG
        uses: Platane/snk@v3
        with:
          github_user_name: inihilmyloh
          outputs: |
            dist/github-contribution-grid-pacman.svg?type=pacman
            dist/github-contribution-grid-pacman-dark.svg?palette=github-dark&type=pacman

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
          commit_message: "chore: update pac-man contribution animation [skip ci]"
