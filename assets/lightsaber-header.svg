<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="800" height="200" viewBox="0 0 800 200">

  <defs>
    <!-- Pixel font simulation via letter-spacing -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .pixel { font-family: 'Press Start 2P', monospace; }
    </style>

    <!-- Outer glow for lightsaber blade -->
    <filter id="bladeGlow" x="-80%" y="-10%" width="260%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Cyan glow filter for text -->
    <filter id="cyanGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Purple glow for border -->
    <filter id="borderGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Scanline pattern for CRT effect -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="800" height="1" y="0" fill="rgba(0,0,0,0.15)"/>
    </pattern>

    <!-- Pixel grid for lightsaber frame background -->
    <pattern id="pixelGrid" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0a0a0f"/>
      <rect width="7" height="7" fill="#0d0d18" x="0.5" y="0.5"/>
    </pattern>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="800" height="200" fill="#080810" rx="12"/>
  <!-- Scanline CRT overlay -->
  <rect width="800" height="200" fill="url(#scanlines)" rx="12" opacity="0.6"/>

  <!-- ── OUTER BORDER (purple glow) ── -->
  <rect x="2" y="2" width="796" height="196" rx="11"
        fill="none" stroke="#7c3aed" stroke-width="2" filter="url(#borderGlow)" opacity="0.9"/>
  <rect x="4" y="4" width="792" height="192" rx="10"
        fill="none" stroke="#a855f7" stroke-width="1.5"/>

  <!-- ── CORNER PIXEL BRACKETS ── -->
  <!-- top-left -->
  <rect x="4"  y="4"  width="20" height="3"  fill="#00ffff"/>
  <rect x="4"  y="4"  width="3"  height="20" fill="#00ffff"/>
  <!-- top-right -->
  <rect x="776" y="4"  width="20" height="3"  fill="#00ffff"/>
  <rect x="793" y="4"  width="3"  height="20" fill="#00ffff"/>
  <!-- bottom-left -->
  <rect x="4"  y="193" width="20" height="3"  fill="#00ffff"/>
  <rect x="4"  y="177" width="3"  height="20" fill="#00ffff"/>
  <!-- bottom-right -->
  <rect x="776" y="193" width="20" height="3"  fill="#00ffff"/>
  <rect x="793" y="177" width="3"  height="20" fill="#00ffff"/>

  <!-- ── DIVIDER LINE (vertical, separating saber area and text) ── -->
  <line x1="200" y1="16" x2="200" y2="184" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,4" opacity="0.7"/>

  <!-- ════════════════════════════════════════ -->
  <!--   LEFT PANEL — LIGHTSABER PIXEL ART      -->
  <!-- ════════════════════════════════════════ -->

  <!-- Frame/panel bg -->
  <rect x="14" y="14" width="172" height="172" fill="url(#pixelGrid)" rx="6"/>
  <rect x="14" y="14" width="172" height="172" fill="none" stroke="#a855f7" stroke-width="1.5" rx="6"/>

  <!-- HILT — bottom part of saber -->
  <!-- Hilt body segments (pixel blocks) -->
  <rect x="88" y="150" width="24" height="6"  fill="#888" rx="1"/>
  <rect x="86" y="143" width="28" height="8"  fill="#aaa" rx="1"/>
  <rect x="88" y="137" width="24" height="7"  fill="#999" rx="1"/>
  <!-- emitter ring -->
  <rect x="84" y="132" width="32" height="6"  fill="#c0c0c0" rx="1"/>
  <!-- activation button pixel -->
  <rect x="104" y="148" width="5" height="5"  fill="#00ffff" rx="1"/>

  <!-- BLADE — upward from hilt -->
  <!-- Core bright white/cyan blade (pixel columns) -->
  <!-- Outer glow (wide, faint) -->
  <rect x="93" y="30" width="14" height="102" fill="#00ffff" opacity="0.08" rx="7" filter="url(#bladeGlow)"/>
  <!-- Mid glow -->
  <rect x="96" y="30" width="8"  height="102" fill="#00ffff" opacity="0.25" rx="4" filter="url(#bladeGlow)"/>
  <!-- Inner core — pixel columns -->
  <rect x="97" y="30" width="2"  height="102" fill="#b2f5ff" opacity="0.9"/>
  <rect x="99" y="30" width="2"  height="102" fill="#ffffff"/>
  <rect x="101" y="30" width="2" height="102" fill="#ffffff"/>
  <rect x="103" y="30" width="2" height="102" fill="#b2f5ff" opacity="0.9"/>
  <!-- Pixel tip cap -->
  <rect x="98" y="28" width="4"  height="4"  fill="#e0ffff" opacity="0.8"/>
  <rect x="99" y="25" width="2"  height="4"  fill="#ffffff" opacity="0.6"/>

  <!-- Pixel sparks / particles floating around blade -->
  <!-- spark dots scattered -->
  <rect x="80"  y="60"  width="2" height="2" fill="#00ffff" opacity="0.8"/>
  <rect x="78"  y="80"  width="2" height="2" fill="#a855f7" opacity="0.9"/>
  <rect x="122" y="55"  width="2" height="2" fill="#00ffff" opacity="0.7"/>
  <rect x="124" y="90"  width="2" height="2" fill="#a855f7" opacity="0.8"/>
  <rect x="75"  y="100" width="2" height="2" fill="#00ffff" opacity="0.6"/>
  <rect x="126" y="70"  width="2" height="2" fill="#00ffff" opacity="0.9"/>
  <rect x="82"  y="45"  width="2" height="2" fill="#a855f7" opacity="0.7"/>
  <rect x="118" y="110" width="2" height="2" fill="#00ffff" opacity="0.8"/>
  <rect x="76"  y="120" width="4" height="4" fill="#a855f7" opacity="0.5"/>
  <rect x="124" y="38"  width="4" height="4" fill="#00ffff" opacity="0.5"/>

  <!-- "EQUIPPED" label pixel -->
  <text x="100" y="174" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="7"
        fill="#a855f7" letter-spacing="1" opacity="0.9">[ EQUIPPED ]</text>

  <!-- ════════════════════════════════════════ -->
  <!--  RIGHT PANEL — PLAYER INFO               -->
  <!-- ════════════════════════════════════════ -->

  <!-- PLAYER 1 label (small, pixel style) -->
  <text x="220" y="44"
        font-family="'Courier New', monospace" font-size="9"
        fill="#a855f7" letter-spacing="3" font-weight="bold">PLAYER  1</text>

  <!-- Separator pixel line under label -->
  <rect x="220" y="50" width="120" height="1" fill="#a855f7" opacity="0.6"/>

  <!-- MAIN NAME — big pixel font -->
  <text x="220" y="90"
        font-family="'Courier New', monospace" font-size="26"
        fill="#00ffff" font-weight="900" letter-spacing="2"
        filter="url(#cyanGlow)">inihilmyloh</text>

  <!-- Underline after name -->
  <rect x="220" y="96" width="530" height="1" fill="#00ffff" opacity="0.25"/>

  <!-- Subtitle line 1 -->
  <text x="220" y="122"
        font-family="'Courier New', monospace" font-size="11"
        fill="#a3e635" letter-spacing="1">Mobile App Dev  //  Flutter  //  Android</text>

  <!-- Blinking cursor pixel (simulated) -->
  <rect x="556" y="110" width="8" height="12" fill="#a3e635" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Status line -->
  <text x="220" y="148"
        font-family="'Courier New', monospace" font-size="9"
        fill="#555577" letter-spacing="1">STATUS :</text>
  <text x="288" y="148"
        font-family="'Courier New', monospace" font-size="9"
        fill="#22d3ee" letter-spacing="1">⚡ ONLINE — CURRENTLY BUILDING</text>

  <!-- HP / XP bars -->
  <text x="220" y="168"
        font-family="'Courier New', monospace" font-size="8"
        fill="#555577">HP</text>
  <!-- HP bar bg -->
  <rect x="240" y="159" width="200" height="8" fill="#1a1a2e" rx="2"/>
  <!-- HP bar fill -->
  <rect x="240" y="159" width="170" height="8" fill="#00ffff" rx="2" opacity="0.85"/>

  <text x="450" y="168"
        font-family="'Courier New', monospace" font-size="8"
        fill="#555577" x="450"> XP</text>
  <text x="460" y="168"
        font-family="'Courier New', monospace" font-size="8"
        fill="#555577">XP</text>
  <!-- XP bar bg -->
  <rect x="480" y="159" width="200" height="8" fill="#1a1a2e" rx="2"/>
  <!-- XP bar fill -->
  <rect x="480" y="159" width="130" height="8" fill="#a855f7" rx="2" opacity="0.85"/>

  <!-- LVL text -->
  <text x="690" y="168"
        font-family="'Courier New', monospace" font-size="8"
        fill="#a855f7">LVL.04</text>

  <!-- Scanline overlay on whole card -->
  <rect width="800" height="200" fill="url(#scanlines)" rx="12" opacity="0.3"/>

</svg>
