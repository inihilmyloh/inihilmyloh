<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <!-- Outer glow for lightsaber blade -->
    <filter id="glow1" x="-100%" y="-10%" width="300%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Glow for text -->
    <filter id="glow2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Border glow -->
    <filter id="glow3">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Scanline pattern -->
    <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="800" height="1" fill="rgba(0,0,0,0.18)"/>
    </pattern>
    <!-- Pixel grid for left panel -->
    <pattern id="pg" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0a0a12"/>
      <rect x="0.5" y="0.5" width="7" height="7" fill="#0d0d18"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="200" fill="#06060f" rx="12"/>
  <rect width="800" height="200" fill="url(#scan)" rx="12" opacity="0.5"/>

  <!-- OUTER BORDER GLOW -->
  <rect x="1" y="1" width="798" height="198" rx="11" fill="none"
        stroke="#7c3aed" stroke-width="2.5" filter="url(#glow3)" opacity="0.8"/>
  <rect x="3" y="3" width="794" height="194" rx="10" fill="none"
        stroke="#a855f7" stroke-width="1"/>

  <!-- CORNER HUD BRACKETS — top-left -->
  <rect x="4" y="4" width="22" height="3" fill="#00ffff"/>
  <rect x="4" y="4" width="3" height="22" fill="#00ffff"/>
  <!-- top-right -->
  <rect x="774" y="4" width="22" height="3" fill="#00ffff"/>
  <rect x="793" y="4" width="3" height="22" fill="#00ffff"/>
  <!-- bottom-left -->
  <rect x="4" y="193" width="22" height="3" fill="#00ffff"/>
  <rect x="4" y="175" width="3" height="22" fill="#00ffff"/>
  <!-- bottom-right -->
  <rect x="774" y="193" width="22" height="3" fill="#00ffff"/>
  <rect x="793" y="175" width="3" height="22" fill="#00ffff"/>

  <!-- VERTICAL DIVIDER -->
  <line x1="198" y1="14" x2="198" y2="186"
        stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- ════════════ LEFT PANEL — LIGHTSABER ════════════ -->
  <rect x="12" y="12" width="176" height="176" fill="url(#pg)" rx="6"/>
  <rect x="12" y="12" width="176" height="176" fill="none"
        stroke="#a855f7" stroke-width="1.5" rx="6"/>

  <!-- HILT -->
  <rect x="86" y="150" width="28" height="6"  fill="#999" rx="1"/>
  <rect x="84" y="143" width="32" height="8"  fill="#bbb" rx="1"/>
  <rect x="86" y="136" width="28" height="8"  fill="#aaa" rx="1"/>
  <!-- emitter ring -->
  <rect x="82" y="130" width="36" height="7"  fill="#ccc" rx="1"/>
  <!-- activation button -->
  <rect x="102" y="147" width="6" height="6"  fill="#00ffff" rx="1">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- BLADE GLOW layers -->
  <rect x="90" y="28" width="20" height="102" fill="#00ffff" opacity="0.06"
        rx="10" filter="url(#glow1)"/>
  <rect x="94" y="28" width="12" height="102" fill="#00ffff" opacity="0.2"
        rx="6" filter="url(#glow1)"/>
  <!-- Core pixel columns -->
  <rect x="96" y="28" width="2" height="102" fill="#b2f5ff" opacity="0.85"/>
  <rect x="98" y="28" width="2" height="102" fill="#ffffff"/>
  <rect x="100" y="28" width="2" height="102" fill="#ffffff"/>
  <rect x="102" y="28" width="2" height="102" fill="#b2f5ff" opacity="0.85"/>
  <!-- Tip -->
  <rect x="97" y="25" width="6" height="5" fill="#e0ffff" opacity="0.8"/>
  <rect x="99" y="22" width="2" height="4" fill="#ffffff" opacity="0.5"/>

  <!-- Spark particles -->
  <rect x="78"  y="62"  width="2" height="2" fill="#00ffff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.8s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="122" y="55"  width="2" height="2" fill="#00ffff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.1s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="76"  y="88"  width="2" height="2" fill="#a855f7" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="124" y="95"  width="2" height="2" fill="#a855f7" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.3s" begin="0.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="80"  y="108" width="2" height="2" fill="#00ffff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.9s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="120" y="72"  width="2" height="2" fill="#00ffff" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.1;0.85" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="74"  y="42"  width="4" height="4" fill="#a855f7" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="122" y="38"  width="4" height="4" fill="#00ffff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- EQUIPPED label -->
  <text x="100" y="177" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="7.5"
        fill="#a855f7" letter-spacing="1.5" opacity="0.85">[ EQUIPPED ]</text>

  <!-- ════════════ RIGHT PANEL — PLAYER INFO ════════════ -->

  <!-- PLAYER 1 label -->
  <text x="218" y="42"
        font-family="'Courier New', Courier, monospace" font-size="9.5"
        fill="#a855f7" letter-spacing="3.5" font-weight="bold">PLAYER  1</text>
  <!-- underline -->
  <rect x="218" y="48" width="118" height="1" fill="#a855f7" opacity="0.5"/>

  <!-- MAIN NAME — large, cyan glow -->
  <text x="218" y="90"
        font-family="'Courier New', Courier, monospace" font-size="28"
        fill="#00ffff" font-weight="900" letter-spacing="1.5"
        filter="url(#glow2)">inihilmyloh</text>

  <!-- Name underline -->
  <rect x="218" y="97" width="535" height="1" fill="#00ffff" opacity="0.2"/>

  <!-- SUBTITLE -->
  <text x="218" y="122"
        font-family="'Courier New', Courier, monospace" font-size="11"
        fill="#a3e635" letter-spacing="1">Mobile App Dev  //  Flutter  //  Android</text>

  <!-- Blinking cursor -->
  <rect x="552" y="110" width="8" height="13" fill="#a3e635" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- STATUS line -->
  <text x="218" y="147"
        font-family="'Courier New', Courier, monospace" font-size="9"
        fill="#444466" letter-spacing="1">STATUS :</text>
  <text x="285" y="147"
        font-family="'Courier New', Courier, monospace" font-size="9"
        fill="#22d3ee" letter-spacing="1">&#x26A1; ONLINE — CURRENTLY BUILDING</text>

  <!-- HP BAR -->
  <text x="218" y="168"
        font-family="'Courier New', Courier, monospace" font-size="8" fill="#444466">HP</text>
  <rect x="237" y="159" width="200" height="8" fill="#111122" rx="2"/>
  <rect x="237" y="159" width="175" height="8" fill="#00ffff" rx="2" opacity="0.8"/>

  <!-- XP BAR -->
  <text x="455" y="168"
        font-family="'Courier New', Courier, monospace" font-size="8" fill="#444466">XP</text>
  <rect x="474" y="159" width="200" height="8" fill="#111122" rx="2"/>
  <rect x="474" y="159" width="130" height="8" fill="#a855f7" rx="2" opacity="0.8"/>

  <!-- LVL -->
  <text x="684" y="168"
        font-family="'Courier New', Courier, monospace" font-size="8"
        fill="#a855f7" letter-spacing="0.5">LVL.04</text>

  <!-- Scanline overlay -->
  <rect width="800" height="200" fill="url(#scan)" rx="12" opacity="0.25"/>
</svg>
